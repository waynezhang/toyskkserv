name: Test
on:
  - push
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
           fetch-depth: 0

      - name: Set up Zig
        uses: jdx/mise-action@v5

      - name: Run tests
        run: zig build test --summary all
